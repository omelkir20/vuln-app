# TP10 partie 5 : workflow de sécurité
name: security

on:
  pull_request:
  push:
    branches: [main]

# Moindre privilège : lecture seule par défaut
permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historique complet : Gitleaks analyse tous les commits
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest git /repo --verbose

  sast:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # uniquement ici, pour publier le SARIF
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" semgrep/semgrep \
            semgrep scan --config p/javascript --config p/owasp-top-ten \
            --error --sarif --output /src/semgrep.sarif /src
      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.1.7
        with:
          sarif_file: semgrep.sarif

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci
      - run: npm audit --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: [secrets, sast, dependencies]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t vuln-app:ci .
      - name: Trivy image
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --severity CRITICAL --exit-code 1 --ignore-unfixed vuln-app:ci
      - name: Trivy config
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest \
            config --severity HIGH,CRITICAL --exit-code 1 /src
